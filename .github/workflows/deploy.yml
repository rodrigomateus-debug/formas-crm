name: Probar y publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Cuenta de servicio y Google simulados (Gmail, Drive) para las pruebas; ver test/gmail-dev-vars.mjs.
      - run: cp .dev.vars.example .dev.vars && node test/gmail-dev-vars.mjs && npm run db:local
      - name: Pruebas de punta a punta contra wrangler dev
        run: |
          npx wrangler dev --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8787/health && break; sleep 1; done
          npm test
      - if: failure()
        run: tail -100 wrangler.log

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
      CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
      FINNEGANS_CLIENT_ID: ${{ secrets.FINNEGANS_CLIENT_ID || secrets.FIN_CLIENT_ID }}
      FINNEGANS_CLIENT_SECRET: ${{ secrets.FINNEGANS_CLIENT_SECRET || secrets.FIN_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Base de datos (la crea si no existe)
        run: node scripts/ensure-d1.mjs
      - run: npm run deploy
      - name: Cuenta de servicio de Gmail (si está cargada en los secretos del repo)
        if: env.GOOGLE_SA_JSON != ''
        run: printf '%s' "$GOOGLE_SA_JSON" | npx wrangler secret put GOOGLE_SA_JSON
      - name: ClickUp, Finnegans y Claude (remitos) para los pedidos (si están cargados en los secretos del repo)
        run: |
          for k in CLICKUP_TOKEN FINNEGANS_CLIENT_ID FINNEGANS_CLIENT_SECRET ANTHROPIC_API_KEY; do
            if [ -n "${!k}" ]; then printf '%s' "${!k}" | npx wrangler secret put "$k"; fi
          done
