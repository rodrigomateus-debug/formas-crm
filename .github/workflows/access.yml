# Login de Cloudflare Access del CRM: deja pasar los mails de Formas (scripts/access.mjs); quién entra de verdad lo
# decide la lista de usuarios del CRM. Cambia quién puede iniciar sesión, así que corre SOLO A MANO:
# GitHub → Actions → «Login de Cloudflare» → Run workflow.
name: Login de Cloudflare

on:
  workflow_dispatch:

jobs:
  access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/access.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
