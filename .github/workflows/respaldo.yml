# Respaldo diario de la base: además del «Time Travel» de D1 (vuelve a cualquier minuto de los últimos 30 días),
# se guarda una copia completa en SQL como artefacto del repo por 90 días. Tiene datos de clientes: el repo es privado.
name: Respaldo de la base

on:
  schedule:
    - cron: '43 7 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/ensure-d1.mjs
      - run: npx wrangler d1 export formas-crm --remote --output formas-crm.sql && gzip formas-crm.sql
      - uses: actions/upload-artifact@v4
        with:
          name: formas-crm-${{ github.run_id }}
          path: formas-crm.sql.gz
          retention-days: 90
